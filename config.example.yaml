data_source:
  kind: ems
  config_path: ./ems_config.json

# 模板中的 *_display 变量读取独立映射文件。
# 缺失映射时会回退显示原始机构号。
store_mapping_file: ./store_mapping.yaml

wecom:
  # 可配置一个或多个企业微信群机器人地址；每条销售单会依次推送到全部地址。
  webhook_urls:
    - https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=YOUR_WEBHOOK_KEY
  timeout_seconds: 5
  retry_times: 2

celebration:
  enabled: false
  threshold: "100000"
  template_path: ./templates/converted/捷报模板.svg
  slide_number: 1
  output_dir: ./data/celebrations
  content_fields:
    - order_no
    - sold_at
    - document_type
    - store_name_display
    - store_region
    - performance_org_display
    - performance_region
    - region
    - salesperson
    - total_amount
    - currency
    - customer_type
    - card_no
    - items
  # GUI 会保存所选 Webhook 地址的哈希，不会在喜报设置区重复保存地址。

runtime:
  scan_interval_seconds: 600
  max_images_per_message: 8
  push_interval_seconds: 10
  push_window_start: "10:00"
  push_window_end: "22:00"
  state_file: ./var/push-state.json
  dry_run: true

backend:
  database_url: sqlite:///./var/app.db
  secret_key: replace-me-with-a-long-random-value
  host: 127.0.0.1
  port: 5000
  bootstrap_admin_username: admin
  bootstrap_admin_password: 8888
