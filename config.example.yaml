data_source:
  kind: ems
  config_path: ./ems_config.json

wecom:
  # 可配置一个或多个企业微信群机器人地址；每条销售单会依次推送到全部地址。
  webhook_urls:
    - https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=YOUR_WEBHOOK_KEY
  timeout_seconds: 5
  retry_times: 2

runtime:
  scan_interval_seconds: 600
  max_images_per_message: 8
  push_interval_seconds: 10
  push_window_start: "10:00"
  push_window_end: "22:00"
  state_file: ./var/push-state.json
  dry_run: true

backend:
  database_url: sqlite:///./var/app.db
  secret_key: replace-me-with-a-long-random-value
  host: 127.0.0.1
  port: 5000
  bootstrap_admin_username: admin
  bootstrap_admin_password: 8888
