<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page_title }} - {{ app_name }}</title>
    <style>
      :root {
        --bg: #f3f1ea;
        --panel: #fffdfa;
        --panel-strong: #f7f0dd;
        --text: #1f2520;
        --muted: #677067;
        --line: #d9d0be;
        --accent: #285943;
        --accent-soft: #e1efe6;
        --danger: #9f2f2f;
        --danger-soft: #f8e6e3;
        --ok: #2f6b3d;
        --ok-soft: #e4f2e8;
        --shadow: 0 18px 40px rgba(61, 60, 45, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(224, 204, 156, 0.35), transparent 30%),
          linear-gradient(180deg, #f8f6ef 0%, var(--bg) 100%);
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .shell {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        padding: 24px 0 48px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        padding: 18px 22px;
        margin-bottom: 20px;
        background: rgba(255, 253, 250, 0.88);
        border: 1px solid rgba(217, 208, 190, 0.8);
        border-radius: 20px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(10px);
      }

      .brand-title {
        margin: 0;
        font-size: 22px;
        font-weight: 700;
      }

      .brand-subtitle {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 14px;
      }

      .nav {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .nav-link {
        padding: 10px 14px;
        border-radius: 999px;
        color: var(--muted);
        background: transparent;
        border: 1px solid transparent;
      }

      .nav-link.active {
        color: #ffffff;
        background: var(--accent);
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 24px;
        box-shadow: var(--shadow);
      }

      .page-header {
        padding: 28px 28px 12px;
      }

      .page-title {
        margin: 0;
        font-size: 28px;
      }

      .page-copy {
        margin: 8px 0 0;
        color: var(--muted);
      }

      .content {
        padding: 0 28px 28px;
      }

      .alert {
        padding: 14px 16px;
        margin-bottom: 16px;
        border-radius: 16px;
        border: 1px solid transparent;
      }

      .alert.error {
        color: var(--danger);
        background: var(--danger-soft);
        border-color: rgba(159, 47, 47, 0.16);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
      }

      .badge.ok {
        color: var(--ok);
        background: var(--ok-soft);
      }

      .badge.neutral {
        color: var(--accent);
        background: var(--accent-soft);
      }

      .badge.danger {
        color: var(--danger);
        background: var(--danger-soft);
      }

      .grid {
        display: grid;
        gap: 18px;
      }

      .rule-card,
      .record-card,
      .status-card,
      .test-card {
        padding: 20px;
        border: 1px solid var(--line);
        border-radius: 20px;
        background: #fffefb;
      }

      .rule-meta,
      .record-meta,
      .status-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 12px;
        color: var(--muted);
        font-size: 14px;
      }

      .summary-list {
        margin: 14px 0 0;
        padding-left: 18px;
        color: var(--text);
      }

      .summary-list li {
        margin: 6px 0;
      }

      .empty-state {
        padding: 32px 20px;
        text-align: center;
        color: var(--muted);
        border: 1px dashed var(--line);
        border-radius: 18px;
        background: #fffdfa;
      }

      .action-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 18px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 18px;
        border: 0;
        border-radius: 14px;
        background: var(--accent);
        color: #ffffff;
        font-weight: 700;
        cursor: pointer;
      }

      .button.secondary {
        background: var(--panel-strong);
        color: var(--text);
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      .form-section {
        padding: 20px;
        border-radius: 20px;
        background: #fffefb;
        border: 1px solid var(--line);
      }

      .field {
        display: grid;
        gap: 8px;
        margin-bottom: 14px;
      }

      .field input,
      .field select {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fffdfa;
        font: inherit;
      }

      .hint {
        color: var(--muted);
        font-size: 13px;
      }

      .single-column {
        width: min(520px, calc(100% - 32px));
        margin: 48px auto;
      }

      @media (max-width: 760px) {
        .topbar {
          flex-direction: column;
          align-items: flex-start;
        }

        .form-grid {
          grid-template-columns: 1fr;
        }

        .action-row {
          flex-direction: column;
          align-items: stretch;
        }
      }
    </style>
  </head>
  <body>
    {% block layout %}
    <div class="shell">
      {% if active_nav %}
      <header class="topbar">
        <div>
          <h1 class="brand-title">{{ app_name }}</h1>
          <p class="brand-subtitle">规则管理、推送记录与手动验证入口</p>
        </div>
        <nav class="nav">
          {% for item in nav_items %}
          <a class="nav-link{% if item.key == active_nav %} active{% endif %}" href="{{ url_for(item.endpoint) }}">
            {{ item.label }}
          </a>
          {% endfor %}
        </nav>
      </header>
      {% endif %}
      {% block body %}{% endblock %}
    </div>
    {% endblock %}
  </body>
</html>
